<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel Stay Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <style>
    body {
      background: #e0e0e0;
    }
    .estimate {
      font-weight: 600;
    }
    .hero {
      position: relative;
      max-width: 1140px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }
    .hero img {
      display: block;
      width: 100%;
      height: clamp(220px, 40vw, 420px);
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1.5rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0) 60%);
      color: #fff;
    }
    .hero-overlay h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .btn-gold {
      background: #e9a24b;
      color: #3a2a10;
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .btn-gold:hover {
      background: #f2b562;
      color: #3a2a10;
    }
  </style>
</head>
<body>
  <nav class="site-nav py-3">
    <div class="container d-flex flex-wrap align-items-center gap-3">
      <span class="site-navbar-brand text-black fw-bold fs-4">🏨 Hotel Stay Planner</span>
      <span class="text-muted">Browse, plan and save your stay</span>
    </div>
  </nav>

  <header class="hero container px-0">
    <img src="image%201.jpg" alt="Hotel swimming pool with sun loungers" />
    <div class="hero-overlay">
      <h1>Find your perfect stay</h1>
      <div class="hero-buttons">
        <a href="#hotel-list" class="btn btn-gold">Book and plan today</a>
        <a href="#contact" class="btn btn-gold">Contact us</a>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <div id="alert-area" aria-live="polite"></div>

    <div class="site-nav row g-4">
      <section class="site-nav col-lg-8">
        <div class="card p-3 mb-3">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="search" class="form-label">Search</label>
              <input id="search" type="text" class="form-control" placeholder="Hotel name or amenity" />
            </div>
            <div class="col-md-3">
              <label for="city-filter" class="form-label">City</label>
              <select id="city-filter" class="form-select">
                <option value="all">All cities</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="price-filter" class="form-label">Max price: $<span id="price-value">300</span></label>
              <input id="price-filter" type="range" class="form-range" min="50" max="300" step="10" value="300" />
            </div>
            <div class="col-md-2">
              <label for="sort" class="form-label">Sort</label>
              <select id="sort" class="form-select">
                <option value="default">Default</option>
                <option value="price-asc">Price ↑</option>
                <option value="price-desc">Price ↓</option>
                <option value="rating">Rating</option>
              </select>
            </div>
          </div>
        </div>

        <div id="loading" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Loading hotels…</p>
        </div>
        <div id="hotel-list" class="row g-3"></div>
      </section>

      <aside class="col-lg-4">
        <div class="card p-3 sticky-lg-top planner" id="planner">
          <h2 class="h5">Plan your stay</h2>
          <p id="selected-hotel" class="text-muted">Choose a hotel to start planning.</p>

          <form id="plan-form" novalidate>
            <div class="mb-2">
              <label for="guest-name" class="form-label">Your name</label>
              <input id="guest-name" class="form-control" type="text" required />
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label for="check-in" class="form-label">Check-in</label>
                <input id="check-in" class="form-control" type="date" required />
              </div>
              <div class="col-6">
                <label for="check-out" class="form-label">Check-out</label>
                <input id="check-out" class="form-control" type="date" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-5">
                <label for="guests" class="form-label">Guests</label>
                <input id="guests" class="form-control" type="number" min="1" max="10" value="2" required />
              </div>
              <div class="col-7">
                <label for="room-type" class="form-label">Room type</label>
                <select id="room-type" class="form-select">
                  <option value="standard">Standard</option>
                  <option value="deluxe">Deluxe (+30%)</option>
                  <option value="suite">Suite (+80%)</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="notes" class="form-label">Notes (optional)</label>
              <textarea id="notes" class="form-control" rows="2" placeholder="Late arrival, dietary needs…"></textarea>
            </div>  

            <div Estimated total 

           >
            </div>
            <button id="save-btn" type="submit" class="btn btn-primary w-100" disabled>Save planned stay</button>
          </form>
        </div>
      </aside>
    </div>

    <section class="mt-5">
      <h2 class="h4">My planned stays</h2>
      <div id="bookings-list" class="row g-3"></div>
    </section>
  </main>

  <footer id="contact" class="text-center small py-4">
    <span id="year"></span> Hotel Stay Planner. All rights reserved.
    <a href="#">Back to top ↑</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
